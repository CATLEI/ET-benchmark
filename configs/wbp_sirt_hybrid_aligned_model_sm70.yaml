# WBP + SIRT hybrid benchmark: Aligned data/model SM70 (±70°)
# -------------------------------------------------------------------------
# Prerequisite (tilt-axis auto-corrected inside convert; expect shape ~ (141,512,513)):
#   python scripts/convert_aligned_model_to_etdflow.py --variant sm70
#
# Usage:
#   et-dflow benchmark configs/wbp_sirt_hybrid_aligned_model_sm70.yaml --output-dir ./results
#
# Hybrid: data prep + evaluation on master. Remote pods: WBP, CPU SIRT,
# ASTRA FBP_CUDA, ASTRA SIRT3D_CUDA. TIGRE / GENFIRE / DeepDeWedge stay disabled until image URIs are set.
# Expected recon shape ~ (512, 513, 513); GT is 512^3 (align off on first run to avoid OOM).

datasets:
  aligned_model_sm70:
    path: "./data/datasets/simulated/aligned_model_sm70_v1/raw/tilt_series.hspy"
    format: "hyperspy"
    ground_truth_path: "./data/datasets/simulated/aligned_model_sm70_v1/ground_truth/volume.hspy"
    metadata:
      variant: "sm70"
      tilt_range: [-70, 70]
      missing_wedge_angle: 70
      gt_shape: [512, 512, 512]
      source_root: "/personal/ET/data/Aligned_data/model/"

algorithms:
  wbp:
    enabled: true
    docker_image: "registry.dp.tech/dptech/dp/native/prod-23359/wbp:20260410"
    parameters:
      filter_type: "ramp"
      filter_cutoff: 1.0
      Nrecon: 513
    resources:
      cpu: 4
      memory: "16Gi"
      gpu: false

  sirt:
    enabled: true
    docker_image: "registry.dp.tech/dptech/dp/native/prod-23359/sirt:20260321"
    parameters:
      backend: "cpu_sirt"
      iterations: 30
      relaxation_factor: 0.5
      update_method: "landweber"
      dtype: "float32"
    resources:
      cpu: 16
      memory: "64Gi"
      gpu: false
  astra_fbp:
    enabled: true
    docker_image: "registry.dp.tech/dptech/dp/native/prod-23359/astra:20261017"
    parameters:
      use_native: true
      allow_placeholder: false
      # Parallel3d has no FBP3D_CUDA. FBP_CUDA = Ram-Lak filter + BP3D_CUDA.
      astra_algorithm: "FBP_CUDA"
      filter_type: "ram-lak"
      tilt_range: [-70, 70]
    resources:
      cpu: 8
      memory: "32Gi"
      # Bohrium rejects nvidia.com/gpu ("parameter Gpu is not valid").
      # scass_type is the Bohrium machine string. DispatcherExecutor writes it
      # to the job scassType during workflow.submit().
      gpu: 1
      scass_type: "c16_m62_1 * NVIDIA T4"

  # Same ASTRA image as FBP. 30 iterations match cpu SIRT.
  # Tilt series (n_angles, 512, 513) -> volume (512, 513, 513).
  astra_sirt:
    enabled: true
    docker_image: "registry.dp.tech/dptech/dp/native/prod-23359/astra:20261017"
    parameters:
      use_native: true
      allow_placeholder: false
      astra_algorithm: "SIRT3D_CUDA"
      astra_algorithm_fallbacks: []
      astra_niter: 30
      astra_vol_shape: [513, 513, 512]
      tilt_range: [-70, 70]
    resources:
      cpu: 8
      memory: "32Gi"
      gpu: 1
      scass_type: "c16_m62_1 * NVIDIA T4"

  # Same output grid as ASTRA: nVoxel is [nz, ny, nx] = (512, 513, 513).
  # Paste the Bohrium URI from docker/algorithms/tigre/Dockerfile.bohr before submitting.
  tigre_sirt:
    enabled: false
    docker_image: "registry.dp.tech/dptech/dp/native/prod-23359/tigre:REPLACE"
    parameters:
      use_native: true
      allow_placeholder: false
      tigre_algorithm: "sirt"
      tigre_niter: 30
      nVoxel: [512, 513, 513]
      tilt_range: [-70, 70]
    resources:
      cpu: 8
      memory: "32Gi"
      gpu: 1
      scass_type: "c16_m62_1 * NVIDIA T4"

  # CPU FFT only. GENFIRE-Python has no CUDA, so this pod does not request a GPU.
  # Short first run: 5 iterations, oversampling 2. Paste the Bohrium URI before enabling.
  genfire:
    enabled: false
    docker_image: "registry.dp.tech/dptech/dp/native/prod-23359/genfire:REPLACE"
    parameters:
      use_native: true
      allow_placeholder: false
      genfire_num_iterations: 5
      genfire_oversampling_ratio: 2
      genfire_gridding_method: "FFT"
      tilt_range: [-70, 70]
    resources:
      cpu: 16
      memory: "64Gi"
      gpu: false

  # Even/odd ramp FBP + ddw prepare/fit/refine inside one GPU pod.
  # mw_angle is derived as 180-(α_max-α_min); do not copy missing_wedge_angle: 70.
  # Paste the Bohrium URI from docker/algorithms/deepdewedge/Dockerfile.bohr first.
  deepdewedge:
    enabled: false
    docker_image: "registry.dp.tech/dptech/dp/native/prod-23359/deepdewedge:REPLACE"
    parameters:
      use_native: true
      allow_placeholder: false
      ddw_pipeline: true
      ddw_num_epochs: 5
      tilt_range: [-70, 70]
    resources:
      cpu: 8
      memory: "64Gi"
      gpu: 1
      scass_type: "c16_m62_1 * NVIDIA T4"

  # In-container WBP (IsoNet input) + prepare_star/extract/refine/predict.
  # isonet_pixel_size is Å/pixel (IsoNet default recommendation ~10); override when
  # the sm70 dataset documents a real value. Paste Dockerfile.bohr URI before enable.
  isonet:
    enabled: false
    docker_image: "registry.dp.tech/dptech/dp/native/prod-23359/isonet:REPLACE"
    parameters:
      use_native: true
      allow_placeholder: false
      isonet_pipeline: true
      isonet_pixel_size: 10.0
      isonet_iterations: 5
      isonet_number_subtomos: 100
      tilt_range: [-70, 70]
    resources:
      cpu: 8
      memory: "64Gi"
      gpu: 1
      scass_type: "c16_m62_1 * NVIDIA T4"

  # WUCON: stage prj.mrc+.tlt, patch /opt/wucon/src, mid-chunk smoke by default.
  # Set wucon_recon_subset: false for full y-sweep. Paste Dockerfile.bohr URI first.
  wucon:
    enabled: false
    docker_image: "registry.dp.tech/dptech/dp/native/prod-23359/wucon:REPLACE"
    parameters:
      use_native: true
      allow_placeholder: false
      wucon_pipeline: true
      wucon_recon_subset: true
      wucon_n_epochs_mid: 50
      wucon_n_epochs_all: 20
      wucon_case_id: 90
      tilt_range: [-70, 70]
    resources:
      cpu: 8
      memory: "64Gi"
      gpu: 1
      scass_type: "c16_m62_1 * NVIDIA T4"
evaluation:
  metrics:
    - "psnr"
    - "ssim"
    - "mse"
  # First run: false to avoid master OOM/Killed on dual-volume eval.
  # Set true (+ enough RAM) for fine alignment onto GT 512^3.
  align_reconstruction: false
  align_target_shape: [512, 512, 512]
  align_max_shift: 8

workflow:
  name: "aligned-model-sm70-wbp-sirt"
  type: "baseline_benchmark"
  output_dir: "./results"
  execution_mode: "hybrid"
  parallelism: 2

runtime_profiles:
  cpu_sirt_default:
    backend: "cpu_sirt"
    threads: 16
    iterations: 30
    dtype: "float32"

dataset_profiles:
  S:
    runtime_profile: "cpu_sirt_default"
  M:
    runtime_profile: "cpu_sirt_default"
  L:
    runtime_profile: "cpu_sirt_default"

policy:
  default_runtime_profile: "cpu_sirt_default"
  execution_policy:
    max_retries: 0
    oom_fallback_backend: "cpu_sirt"
    oom_fallback_overrides:
      use_native: false

dflow:
  mode: "remote"
  host: "http://workflows.deepmodeling.com"
  k8s_api_server: "http://workflows.deepmodeling.com"
  namespace: "argo"
  token: ""
  s3_repo_key: "oss-bohrium"
  s3_storage_client: "dflow.plugins.bohrium.TiefblueClient"
  bohrium_username: ""
  bohrium_password: ""
  bohrium_project_id: "3407188"
